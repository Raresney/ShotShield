[package]
name = "desktop"
version = "0.9.0"
description = "ShotShield: find and redact sensitive data in screenshots"
authors = ["Rareș (@Raresney)"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# In-app updates: check GitHub for a newer signed release and relaunch after
# installing. Desktop-only plugins.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Screen capture, plus the tray icon and start-at-login that keep its shortcut
# available with the window closed. Windows and macOS only: see build.rs.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = { version = "0.9", default-features = false }

[target."cfg(windows)".dependencies]
# The system OCR (Windows.Media.Ocr), read alongside Tesseract.
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Raises the capture overlay above the menu bar and the Dock.
objc2 = "0.6"
