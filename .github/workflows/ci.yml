name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Detection engine: behaviour tests + type check.
      - run: npm test -w core
      - run: npm run typecheck -w core

      # Front end: unit tests, then type check + production bundle (no Rust/Tauri
      # needed for this).
      - run: npm test -w desktop
      - run: npm run build -w desktop

  # The Rust side has code for each platform (capture, the tray, the Windows
  # OCR), and the release is the only other place it gets built. Compile it on
  # all three here so a break on one shows up in the PR, not at release time.
  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # The WebKitGTK stack Tauri builds against, as in the release workflow.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # The app embeds the built front end, so it has to exist to compile.
      - run: npm ci
      - run: npm run build -w desktop
      - run: cargo check --locked
        working-directory: desktop/src-tauri
      # Unit tests, including the ones only a given platform compiles (the
      # Linux portal's URI handling).
      - run: cargo test --locked --lib
        working-directory: desktop/src-tauri

  # The real flows in a browser: OCR, PDF, saving, settings. Slower, so it runs
  # beside the unit job rather than inside it.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: desktop
      - run: npm run e2e -w desktop
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            desktop/playwright-report
            desktop/test-results
          retention-days: 7
