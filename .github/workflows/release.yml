name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Keep building the other platforms even if one fails, so a Linux hiccup
      # never blocks the Windows release (and its updater manifest).
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          # One universal build covers Apple Silicon and Intel Macs.
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # Tauri's Linux build needs the WebKitGTK stack and packaging tools.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci

      # Windows code signing through Azure Artifact Signing (formerly Trusted
      # Signing). Off until the repo has the AZURE_SIGNING_* variables and the
      # AZURE_CLIENT_* secrets; see .github/SIGNING.md. When on, Tauri signs the
      # exe, the installers and the updater bundle with signCommand, so
      # SmartScreen stops warning once the certificate has some reputation.
      - name: Configure Windows code signing
        id: winsign
        if: matrix.platform == 'windows-latest' && vars.AZURE_SIGNING_ACCOUNT != ''
        shell: bash
        run: |
          cargo install trusted-signing-cli --version 0.11.0 --locked
          cat > desktop/src-tauri/tauri.windows-signing.json <<JSON
          {
            "bundle": {
              "windows": {
                "signCommand": "trusted-signing-cli -e ${{ vars.AZURE_SIGNING_ENDPOINT }} -a ${{ vars.AZURE_SIGNING_ACCOUNT }} -c ${{ vars.AZURE_SIGNING_PROFILE }} -d ShotShield %1"
              }
            }
          }
          JSON
          echo "args=--config src-tauri/tauri.windows-signing.json" >> "$GITHUB_OUTPUT"

      # On a tag push this publishes (or appends to) the release with this
      # platform's installer attached; tauri-action merges each matrix job into
      # one latest.json for the updater. A manual run leaves tagName empty, so it
      # only builds and proves the pipeline works without cutting a release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the bundles and emits the latest.json manifest the in-app
          # updater reads. Set these secrets in the repo before tagging a release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read by trusted-signing-cli; empty (and unused) unless signing is set up.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ShotShield ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.winsign.outputs.args }}
